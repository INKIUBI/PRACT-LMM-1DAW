    <main>
        <br>
        </div>
        <h2>Contacto con profesionales</h2>
        <div class="bloque-formulario">
            <div class="form">
                <form action="php/procesamiento_formulario.php" method="POST">
                    <div id="campo">
                            <label for="nombre">Nombre y Apellidos:</label>
                            <input type="text" id="nombre" name="nombre" 
                                class="nombre-email-tel"
                                required 
                                pattern="^[A-ZÁÉÍÓÚÑa-zñáéíóú ]{3,50}$" 
                                title="Introduce nombre y apellidos (solo letras)">
                    </div>
<br>
                    <!-- Campo Email -->
                    <div class="campo">
                            <label for="email">Email de contacto:</label>
                            <input type="email" id="email" name="email"
                                class="nombre-email-tel"
                                required 
                                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" 
                                title="Introduce un email válido (ejemplo@dominio.com)">
                    </div>
<br>
                    <!-- Campo Telefono -->
                    <div class="campo">
                        <label for="telefono">Número de teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" 
                            class="nombre-email-tel"
                            required 
                            pattern="[0-9]{9}" 
                            title="El teléfono debe tener 9 dígitos numéricos">
                    </div>
<br>
                    <!-- Seleccion de provincia -->
                    <div class="campo">
                        <label for="provincia">Provincia de Andalucía:</label>
                        <select id="provincia" name="provincia">
                            <option value="almeria">Almería</option>
                            <option value="cadiz">Cádiz</option>
                            <option value="cordoba">Córdoba</option>
                            <option value="granada">Granada</option>
                            <option value="huelva">Huelva</option>
                            <option value="jaen">Jaén</option>
                            <option value="malaga" selected>Málaga</option>
                            <option value="sevilla">Sevilla</option>
                        </select>
                    </div>        
<br>
                    <div class="campo">
                        <label for="motivo">Motivo del contacto (Máximo 300 caracteres):</label>
<br><br>
                        <!-- Textarea -->
                        <textarea id="motivo" name="motivo" 
                            maxlength="300" 
                            required 
                            placeholder="Escribe aquí tu consulta..."></textarea>
                    </div>
                    
                    <!-- Botones -->
                    <div class="botones">
                        <input type="reset" value="Borrar datos" id="reset">
                        <br><br>
                        <input type="submit" value="Enviar información" id="boton-enviar">
                    </div>
                </form>
            </div>
            <img src="img/Cosas/fotoform.png" class="img">
        </div>
    </main>
